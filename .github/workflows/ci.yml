name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install validation tools
        run: python -m pip install --disable-pip-version-check ruff==0.16.4 rumdl==0.2.62

      - name: Run unit and contract tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check Python
        run: |
          # Keep the selected rules explicit across local and CI environments.
          ruff check --isolated --select E4,E7,E9,F,I,B,SIM117,EXE001 .
          ruff format --check --isolated .

      - name: Check Markdown
        run: >-
          rumdl check --disable MD013
          README.md README_ZH.md CHANGELOG.md CONTEXT.md docs
          skill/dag/SKILL.md
          skill/dag/references/admission.md
          skill/dag/references/artifact-handles.md
          skill/dag/references/candidate-review.md
          skill/dag/references/claims.md
          skill/dag/references/definition-binding.md
          skill/dag/references/dispositions.md
          skill/dag/references/execution-records.md
          skill/dag/references/exploration-cache.md
          skill/dag/references/integration-transitions.md
          skill/dag/references/review-context.md
          skill/dag/references/recovery.md
          skill/dag/references/promotion.md
          skill/dag/references/terminal-outcome.md
          skill/dag/references/ticket-execution.md

      - name: Check command interfaces
        run: |
          python skill/dag/scripts/install_runtime_skills.py --help
          python skill/dag/scripts/record_execution_checkpoint.py --help
          python skill/dag/scripts/index_execution_record.py --help
          python skill/dag/scripts/record_exploration_note.py --help
          python skill/dag/scripts/record_tool_artifact.py --help
          python skill/dag/scripts/plan_execution_admission.py --help
          python skill/dag/scripts/record_execution_claim.py --help
          python skill/dag/scripts/record_review_context.py --help
          python skill/dag/scripts/record_candidate_review.py --help
          python skill/dag/scripts/verify_candidate_review.py --help
          python skill/dag/scripts/reconcile_execution_claim.py --help
          python skill/dag/scripts/verify_promotion_package.py --help
          python skill/dag/scripts/record_ticket_disposition.py --help
          python skill/dag/scripts/verify_terminal_outcome.py --help
          python skill/dag/scripts/validate_definition_index.py --help
          python skill/dag/scripts/promote_local_transition.py --help
